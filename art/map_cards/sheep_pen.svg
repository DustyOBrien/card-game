  <!-- The sheep. -->
  <g stroke="#7a7466" stroke-width="1.5">
    <ellipse cx="34" cy="34" rx="14" ry="9" fill="#f2efe6"/>
    <circle cx="24" cy="30" r="6" fill="#f2efe6"/><circle cx="44" cy="30" r="6" fill="#f2efe6"/>
    <ellipse cx="18" cy="34" rx="5" ry="4" fill="#3d3a35"/>
