<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A blueprint: a rolled-up blue sheet with a white house plan drawn on it. -->
  <rect x="14" y="22" width="100" height="84" rx="4" fill="#2f6fb8" stroke="#163a66" stroke-width="4"/>
  <!-- The rolled ends. -->
  <rect x="8" y="16" width="14" height="96" rx="7" fill="#3f82cc" stroke="#163a66" stroke-width="4"/>
  <rect x="106" y="16" width="14" height="96" rx="7" fill="#3f82cc" stroke="#163a66" stroke-width="4"/>
  <!-- Grid lines. -->
  <g stroke="#7fb2ea" stroke-width="1" opacity="0.6">
    <path d="M22 38 H106 M22 54 H106 M22 70 H106 M22 86 H106"/>
    <path d="M38 22 V106 M54 22 V106 M70 22 V106 M86 22 V106"/>
  </g>
  <!-- The house plan. -->
  <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M40 92 V60 L64 40 L88 60 V92 Z"/>
    <path d="M56 92 V74 H72 V92"/>
    <path d="M44 66 H52 V74 H44 Z M76 66 H84 V74 H76 Z"/>
  </g>
  <!-- Measurement marks. -->
  <path d="M40 98 H88 M40 95 V101 M88 95 V101" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
</svg>
