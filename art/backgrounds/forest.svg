<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- The Forest: tall dark trees, a mossy clearing and beams of light.
       The bottom fades to dark so your hand and the numbers stay easy to read. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a2c"/>
      <stop offset="1" stop-color="#4f7a52"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c6e34"/>
      <stop offset="1" stop-color="#2c4420"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff3c0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14131c" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#14131c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14131c" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <!-- Far pine trees -->
  <g fill="#2a4a33" opacity="0.9">
    <path d="M0 130 L-34 300 L34 300 Z"/><path d="M46 165 L12 300 L80 300 Z"/><path d="M114 187 L80 300 L148 300 Z"/><path d="M148 138 L114 300 L182 300 Z"/><path d="M215 184 L181 300 L249 300 Z"/><path d="M261 153 L227 300 L295 300 Z"/><path d="M303 132 L269 300 L337 300 Z"/><path d="M370 177 L336 300 L404 300 Z"/><path d="M407 185 L373 300 L441 300 Z"/><path d="M471 164 L437 300 L505 300 Z"/><path d="M512 175 L478 300 L546 300 Z"/><path d="M564 155 L530 300 L598 300 Z"/><path d="M627 187 L593 300 L661 300 Z"/><path d="M684 183 L650 300 L718 300 Z"/><path d="M725 150 L691 300 L759 300 Z"/><path d="M790 153 L756 300 L824 300 Z"/><path d="M823 154 L789 300 L857 300 Z"/><path d="M892 165 L858 300 L926 300 Z"/><path d="M927 176 L893 300 L961 300 Z"/><path d="M979 155 L945 300 L1013 300 Z"/><path d="M1034 172 L1000 300 L1068 300 Z"/><path d="M1095 181 L1061 300 L1129 300 Z"/><path d="M1151 183 L1117 300 L1185 300 Z"/><path d="M1204 171 L1170 300 L1238 300 Z"/><path d="M1255 138 L1221 300 L1289 300 Z"/><path d="M1295 184 L1261 300 L1329 300 Z"/>
  </g>
  <!-- Big trunks in front -->
  <g fill="#3b2a1c" stroke="#24180f" stroke-width="3">
    <rect x="60" y="0" width="52" height="330" /><rect x="250" y="0" width="52" height="330" /><rect x="470" y="0" width="40" height="330" /><rect x="820" y="0" width="45" height="330" /><rect x="1040" y="0" width="37" height="330" /><rect x="1230" y="0" width="51" height="330" />
  </g>
  <!-- The leafy roof -->
  <g fill="#1f4026">
    <circle cx="7" cy="-6" r="106"/><circle cx="71" cy="29" r="83"/><circle cx="170" cy="33" r="104"/><circle cx="253" cy="39" r="90"/><circle cx="339" cy="27" r="99"/><circle cx="421" cy="9" r="85"/><circle cx="520" cy="1" r="85"/><circle cx="582" cy="26" r="89"/><circle cx="681" cy="21" r="91"/><circle cx="773" cy="18" r="88"/><circle cx="854" cy="-6" r="77"/><circle cx="936" cy="16" r="80"/><circle cx="1029" cy="11" r="79"/><circle cx="1119" cy="21" r="96"/><circle cx="1176" cy="32" r="74"/><circle cx="1284" cy="25" r="106"/>
  </g>
  <!-- Light coming through the leaves -->
  <g fill="url(#ray)">
    <path d="M380 0 L440 0 L540 320 L420 320 Z"/><path d="M640 0 L700 0 L800 320 L680 320 Z"/><path d="M900 0 L960 0 L1060 320 L940 320 Z"/>
  </g>
  <!-- The mossy clearing where the fight happens -->
  <path d="M0 300 C220 288 420 296 640 298 C860 300 1060 288 1280 296 L1280 720 L0 720 Z" fill="url(#ground)"/>
  <!-- Ferns and little mushrooms -->
  <g stroke="#2f5a26" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M110 330 q-14 -14 -20 -26 M110 330 q0 -18 2 -28 M110 330 q14 -14 22 -24"/>
    <path d="M520 336 q-12 -12 -18 -22 M520 336 q0 -16 2 -24 M520 336 q12 -12 18 -20"/>
    <path d="M1150 326 q-14 -14 -20 -26 M1150 326 q0 -18 2 -28 M1150 326 q14 -14 22 -24"/>
  </g>
  <g>
    <rect x="330" y="318" width="6" height="10" fill="#efe2c8"/><path d="M324 320 q9 -12 18 0 z" fill="#c9433a"/>
    <rect x="980" y="324" width="6" height="10" fill="#efe2c8"/><path d="M974 326 q9 -12 18 0 z" fill="#c9433a"/>
  </g>

  <!-- Darken the bottom for the UI -->
  <rect y="240" width="1280" height="480" fill="url(#shade)"/>
</svg>
