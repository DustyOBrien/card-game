<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
  <!-- A Slime Knight: a slime in armour. Blocks and rallies its friends. -->
  <defs>
    <radialGradient id="body" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#a8d8ff"/>
      <stop offset="0.55" stop-color="#4f8fd6"/>
      <stop offset="1" stop-color="#2a4f8a"/>
    </radialGradient>
  </defs>
  <!-- Shadow on the grass -->
  <ellipse cx="100" cy="138" rx="78" ry="10" fill="#000000" opacity="0.28"/>
  <!-- Body -->
  <path d="M22 132 C14 132 12 118 20 104 C30 60 62 22 100 22 C138 22 170 60 180 104
           C188 118 186 132 178 132 C160 136 140 128 128 134 C114 140 86 140 72 134
           C60 128 40 136 22 132 Z"
        fill="url(#body)" stroke="#1b335c" stroke-width="4" stroke-linejoin="round"/>
  <!-- Shine -->
  <ellipse cx="72" cy="50" rx="18" ry="10" fill="#ffffff" opacity="0.55" transform="rotate(-30 72 50)"/>
  <circle cx="54" cy="70" r="5" fill="#ffffff" opacity="0.45"/>
  <!-- Eyes -->
  <ellipse cx="78" cy="86" rx="13" ry="17" fill="#ffffff"/>
  <ellipse cx="122" cy="86" rx="13" ry="17" fill="#ffffff"/>
  <ellipse cx="81" cy="90" rx="7" ry="10" fill="#1b1b24"/>
  <ellipse cx="119" cy="90" rx="7" ry="10" fill="#1b1b24"/>
  <circle cx="84" cy="85" r="3" fill="#ffffff"/>
  <circle cx="122" cy="85" r="3" fill="#ffffff"/>
  <!-- Helmet -->
  <path d="M46 62 C52 22 148 22 154 62 L154 70 L46 70 Z" fill="#b8bcc6" stroke="#4a4f5c" stroke-width="4" stroke-linejoin="round"/>
  <rect x="96" y="20" width="8" height="48" fill="#8a8f9c"/>
  <path d="M100 20 C92 6 112 2 116 10 C108 10 104 14 100 20 Z" fill="#e04a4a"/>
  <!-- Shield -->
  <path d="M150 92 L186 92 L186 112 C186 126 176 134 168 138 C160 134 150 126 150 112 Z" fill="#d9a63a" stroke="#6b4e12" stroke-width="4" stroke-linejoin="round"/>
  <path d="M168 98 L168 130 M156 108 L180 108" stroke="#6b4e12" stroke-width="4"/>
  <!-- Mouth -->
  <path d="M90 113 Q100 121 110 113" fill="none" stroke="#1b335c" stroke-width="4" stroke-linecap="round"/>
  <!-- A little drip -->
  <path d="M150 120 C150 112 158 112 158 120 C158 128 150 128 150 120 Z" fill="#4f8fd6"/>
</svg>
