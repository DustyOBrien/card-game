  <path d="M98 92 L84 98 L98 104 Z" fill="#ffcf40" stroke="#2a1a0c" stroke-width="2"/>
  <path d="M66 124 L72 118 L78 124 L84 118 L90 124 L94 120" fill="none" stroke="#2a1a0c" stroke-width="4" stroke-linejoin="round"/>
