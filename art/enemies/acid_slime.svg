<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
  <!-- An Acid Slime: sickly yellow and angry. Its spit burns. -->
  <defs>
    <radialGradient id="body" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f4ff8a"/>
      <stop offset="0.55" stop-color="#b8d22c"/>
      <stop offset="1" stop-color="#6b7a10"/>
    </radialGradient>
  </defs>
  <!-- Shadow on the grass -->
  <ellipse cx="100" cy="138" rx="78" ry="10" fill="#000000" opacity="0.28"/>
  <!-- Body -->
  <path d="M22 132 C14 132 12 118 20 104 C30 60 62 22 100 22 C138 22 170 60 180 104
           C188 118 186 132 178 132 C160 136 140 128 128 134 C114 140 86 140 72 134
           C60 128 40 136 22 132 Z"
        fill="url(#body)" stroke="#4a5208" stroke-width="4" stroke-linejoin="round"/>
  <!-- Shine -->
  <ellipse cx="72" cy="50" rx="18" ry="10" fill="#ffffff" opacity="0.55" transform="rotate(-30 72 50)"/>
  <circle cx="54" cy="70" r="5" fill="#ffffff" opacity="0.45"/>
  <!-- Eyes -->
  <ellipse cx="78" cy="86" rx="13" ry="17" fill="#ffffff"/>
  <ellipse cx="122" cy="86" rx="13" ry="17" fill="#ffffff"/>
  <ellipse cx="81" cy="90" rx="7" ry="10" fill="#1b1b24"/>
  <ellipse cx="119" cy="90" rx="7" ry="10" fill="#1b1b24"/>
  <circle cx="84" cy="85" r="3" fill="#ffffff"/>
  <circle cx="122" cy="85" r="3" fill="#ffffff"/>
  <!-- Angry brows -->
  <path d="M62 66 L92 76" stroke="#4a5208" stroke-width="6" stroke-linecap="round"/>
  <path d="M138 66 L108 76" stroke="#4a5208" stroke-width="6" stroke-linecap="round"/>
  <!-- Mouth -->
  <path d="M88 118 Q100 108 112 118" fill="none" stroke="#4a5208" stroke-width="4" stroke-linecap="round"/>
  <!-- A little drip -->
  <path d="M150 120 C150 112 158 112 158 120 C158 128 150 128 150 120 Z" fill="#b8d22c"/>
  <!-- Acid drips -->
  <path d="M46 128 C46 120 54 120 54 128 C54 140 46 140 46 128 Z" fill="#d8f040"/>
  <path d="M120 136 C120 130 126 130 126 136 C126 144 120 144 120 136 Z" fill="#d8f040"/>
  <circle cx="34" cy="96" r="4" fill="#f4ff8a" opacity="0.8"/>
</svg>
